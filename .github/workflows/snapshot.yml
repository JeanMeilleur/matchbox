name: Snapshot

on:
  push:
    branches:
      - develop
  workflow_dispatch:

# A newer develop push supersedes the older build, including its publication.
concurrency:
  group: matchbox-snapshot-build
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  snapshot:
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/release.yml
    with:
      snapshot: true
    secrets: inherit
